services:
  postgres:
    image: postgres:16
    container_name: slimthicc-command-center-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: slimthicc_command_center
    ports:
      - "5432:5432"
    volumes:
      - slimthicc_postgres_data:/var/lib/postgresql/data

volumes:
  slimthicc_postgres_data:
