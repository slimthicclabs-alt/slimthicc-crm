<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slimthicc Store CRM</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Slimthicc CRM navigation">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">ST</div>
          <div>
            <h1>Slimthicc</h1>
            <p>Store Relationship CRM</p>
          </div>
        </div>

        <nav class="nav-list" aria-label="Primary">
          <button class="nav-item active" type="button" data-view="pipeline" title="Pipeline">
            <span aria-hidden="true">◇</span>
            <span>Pipeline</span>
          </button>
          <button class="nav-item" type="button" data-view="accounts" title="Accounts">
            <span aria-hidden="true">▦</span>
            <span>Accounts</span>
          </button>
          <button class="nav-item" type="button" data-view="tasks" title="Tasks">
            <span aria-hidden="true">✓</span>
            <span>Tasks</span>
          </button>
        </nav>

        <div class="sidebar-metrics">
          <div>
            <span id="metric-active">0</span>
            <small>Active stores</small>
          </div>
          <div>
            <span id="metric-monthly">$0</span>
            <small>Projected monthly</small>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Wholesale and retail relationships</p>
            <h2 id="view-title">Pipeline</h2>
          </div>
          <div class="topbar-actions">
            <span class="sync-badge" id="sync-status" title="Sync status">Starting</span>
            <label class="search-wrap">
              <span aria-hidden="true">⌕</span>
              <input id="search-input" type="search" placeholder="Search stores, contacts, cities" />
            </label>
            <button class="icon-button" id="export-button" type="button" title="Export stores as CSV" aria-label="Export stores as CSV">
              ⇩
            </button>
            <button class="primary-button" id="new-store-button" type="button">
              <span aria-hidden="true">＋</span>
              Add Store
            </button>
          </div>
        </header>

        <section class="insight-row" aria-label="Store relationship summary">
          <article class="stat-card">
            <small>Needs follow-up</small>
            <strong id="stat-followups">0</strong>
          </article>
          <article class="stat-card">
            <small>Samples placed</small>
            <strong id="stat-samples">0</strong>
          </article>
          <article class="stat-card">
            <small>Open purchase orders</small>
            <strong id="stat-orders">0</strong>
          </article>
          <article class="stat-card">
            <small>Avg relationship health</small>
            <strong id="stat-health">0%</strong>
          </article>
        </section>

        <section class="view-panel active" id="pipeline-view" aria-label="Pipeline board">
          <div class="filter-strip">
            <div class="segmented-control" role="group" aria-label="Filter stores">
              <button type="button" class="segment active" data-filter="all">All</button>
              <button type="button" class="segment" data-filter="hot">Hot</button>
              <button type="button" class="segment" data-filter="due">Due</button>
              <button type="button" class="segment" data-filter="buyer">Buyer</button>
            </div>
            <select id="region-filter" aria-label="Filter by region">
              <option value="all">All regions</option>
            </select>
          </div>
          <div class="pipeline-board" id="pipeline-board"></div>
        </section>

        <section class="view-panel" id="accounts-view" aria-label="Account table">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Store</th>
                  <th>Contact</th>
                  <th>Stage</th>
                  <th>Region</th>
                  <th>Next step</th>
                  <th>Monthly</th>
                </tr>
              </thead>
              <tbody id="accounts-table"></tbody>
            </table>
          </div>
        </section>

        <section class="view-panel" id="tasks-view" aria-label="Relationship tasks">
          <div class="tasks-list" id="tasks-list"></div>
        </section>
      </main>
    </div>

    <dialog id="store-dialog">
      <form method="dialog" id="store-form">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">Store account</p>
            <h3 id="dialog-title">Add Store</h3>
          </div>
          <button class="icon-button" value="cancel" type="submit" aria-label="Close" title="Close">×</button>
        </div>

        <input type="hidden" id="store-id" />
        <div class="form-grid">
          <label>
            Store name
            <input id="store-name" required />
          </label>
          <label>
            Contact
            <input id="contact-name" required />
          </label>
          <label>
            Email
            <input id="contact-email" type="email" />
          </label>
          <label>
            Phone
            <input id="contact-phone" />
          </label>
          <label>
            City
            <input id="city" required />
          </label>
          <label>
            Region
            <input id="region" required />
          </label>
          <label>
            Stage
            <select id="stage">
              <option>Prospect</option>
              <option>Contacted</option>
              <option>Sample Sent</option>
              <option>Negotiating</option>
              <option>Stockist</option>
            </select>
          </label>
          <label>
            Priority
            <select id="priority">
              <option>Hot</option>
              <option>Warm</option>
              <option>Watch</option>
            </select>
          </label>
          <label>
            Next follow-up
            <input id="next-follow-up" type="date" />
          </label>
          <label>
            Projected monthly order
            <input id="monthly-order" type="number" min="0" step="50" />
          </label>
          <label>
            Relationship health
            <input id="health" type="range" min="0" max="100" step="5" />
            <span id="health-value">75%</span>
          </label>
          <label>
            Buyer type
            <select id="buyer-type">
              <option>Owner</option>
              <option>Buyer</option>
              <option>Manager</option>
              <option>Distributor</option>
            </select>
          </label>
        </div>

        <label class="wide-label">
          Notes
          <textarea id="notes" rows="5"></textarea>
        </label>

        <div class="dialog-actions">
          <button class="danger-button" id="delete-store-button" type="button">Delete</button>
          <span></span>
          <button class="secondary-button" value="cancel" type="submit">Cancel</button>
          <button class="primary-button" id="save-store-button" value="default" type="submit">Save Store</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
