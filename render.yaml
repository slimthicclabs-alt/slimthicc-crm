services:
  - type: web
    name: slimthicc-store-crm
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: CRM_PASSCODE
        sync: false
    disk:
      name: slimthicc-crm-data
      mountPath: /var/data
      sizeGB: 1
